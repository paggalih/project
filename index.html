<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSC manufacturing cost optimizer</title>
<style>
  :root{
    --bg:#0f1210; --panel:#161b18; --border:#2a322d;
    --text:#e8ece9; --muted:#8b978f;
    --accent:#5dcaa5; --accent-dark:#1d9e75;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Courier New', monospace; padding:24px;}
  h1{font-size:20px; font-weight:600; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 24px;}
  .grid{display:grid; grid-template-columns:320px 1fr; gap:20px;}
  @media (max-width:850px){ .grid{grid-template-columns:1fr;} }
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px;}
  fieldset{border:1px solid var(--border); border-radius:6px; margin:0 0 14px; padding:8px 10px;}
  legend{color:var(--accent); font-size:12px; padding:0 4px;}
  label{display:block; font-size:11px; color:var(--muted); margin:8px 0 3px;}
  input[type=number]{width:100%; background:#0c0f0d; border:1px solid var(--border); color:var(--text); padding:5px 7px; border-radius:4px; font-family:inherit; font-size:12px;}
  button{margin-top:14px; width:100%; padding:10px; border:none; border-radius:4px; background:var(--accent-dark); color:#eafff6; font-family:inherit; font-weight:600; cursor:pointer; font-size:13px;}
  button:hover{background:var(--accent);}
  table{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;}
  th,td{padding:6px 8px; border-bottom:1px solid var(--border); text-align:left;}
  th{color:var(--muted); font-weight:600;}
  .stat{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .stat span:last-child{color:var(--accent);}
  .warn{color:#ef9f27; font-size:12px; margin-top:10px;}
</style>
</head>
<body>

<h1>MSC manufacturing cost optimizer</h1>
<p class="sub">Finds cheapest equipment + staffing mix that meets your monthly cell target.</p>

<div class="grid">
  <div class="panel">

    <fieldset>
      <legend>Production target</legend>
      <label>Monthly cell target (cells)</label>
      <input type="number" id="cellTarget" value="500000000">
      <label>Cell yield per bioreactor batch</label>
      <input type="number" id="yieldPerBatch" value="50000000">
      <label>Working hours per month</label>
      <input type="number" id="workHours" value="480">
    </fieldset>

    <fieldset>
      <legend>Stage timing (hours per batch)</legend>
      <label>Bioreactor cycle time</label>
      <input type="number" id="bioTime" value="72">
      <label>Incubator cycle time (flask stage)</label>
      <input type="number" id="incTime" value="24">
      <label>Biosafety cabinet time per batch</label>
      <input type="number" id="cabTime" value="2">
      <label>Laborant time per batch</label>
      <input type="number" id="laborTime" value="4">
      <label>Flasks needed per batch</label>
      <input type="number" id="flasksPerBatch" value="10">
    </fieldset>

    <fieldset>
      <legend>Equipment cost</legend>
      <label>Bioreactor price (one-time)</label>
      <input type="number" id="bioPrice" value="20000">
      <label>Incubator price (one-time)</label>
      <input type="number" id="incPrice" value="8000">
      <label>Biosafety cabinet price (one-time)</label>
      <input type="number" id="cabPrice" value="12000">
      <label>Flask price (per unit)</label>
      <input type="number" id="flaskPrice" value="5">
      <label>Equipment depreciation (months)</label>
      <input type="number" id="deprMonths" value="60">
    </fieldset>

    <fieldset>
      <legend>Labor & other costs</legend>
      <label>Laborant monthly salary</label>
      <input type="number" id="salary" value="3500">
      <label>Lab fixed overhead per month</label>
      <input type="number" id="overhead" value="10000">
      <label>Production cost per dose (media, reagents etc)</label>
      <input type="number" id="patientCost" value="200">
      <label>Cells per patient dose</label>
      <input type="number" id="cellsPerDose" value="1000000">
      <label>Revenue charged per patient dose</label>
      <input type="number" id="revenuePerDose" value="1500">
    </fieldset>

    <fieldset>
      <legend>Search limits</legend>
      <label>Max units to test per equipment type</label>
      <input type="number" id="maxSearch" value="20">
    </fieldset>

    <button onclick="optimize()">Find cheapest config</button>
  </div>

  <div class="panel">
    <div id="stats"></div>
    <div id="bepStats"></div>
    <table id="resultTable">
      <thead><tr><th>Resource</th><th>Count needed</th><th>Monthly cost</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="warning" class="warn"></div>
  </div>
</div>

<script>
function optimize(){
  const cellTarget = parseFloat(document.getElementById('cellTarget').value);
  const yieldPerBatch = parseFloat(document.getElementById('yieldPerBatch').value);
  const workHours = parseFloat(document.getElementById('workHours').value);

  const bioTime = parseFloat(document.getElementById('bioTime').value);
  const incTime = parseFloat(document.getElementById('incTime').value);
  const cabTime = parseFloat(document.getElementById('cabTime').value);
  const laborTime = parseFloat(document.getElementById('laborTime').value);
  const flasksPerBatch = parseFloat(document.getElementById('flasksPerBatch').value);

  const bioPrice = parseFloat(document.getElementById('bioPrice').value);
  const incPrice = parseFloat(document.getElementById('incPrice').value);
  const cabPrice = parseFloat(document.getElementById('cabPrice').value);
  const flaskPrice = parseFloat(document.getElementById('flaskPrice').value);
  const deprMonths = parseFloat(document.getElementById('deprMonths').value);

  const salary = parseFloat(document.getElementById('salary').value);
  const overhead = parseFloat(document.getElementById('overhead').value);
  const patientCost = parseFloat(document.getElementById('patientCost').value);
  const cellsPerDose = parseFloat(document.getElementById('cellsPerDose').value);
  const revenuePerDose = parseFloat(document.getElementById('revenuePerDose').value);

  const maxSearch = parseInt(document.getElementById('maxSearch').value);

  // batches required per month to hit cell target
  const batchesNeeded = Math.ceil(cellTarget / yieldPerBatch);

  let best = null;

  // brute-force grid search over equipment/staff counts
  for(let bio=1; bio<=maxSearch; bio++){
    const bioCapacity = Math.floor((workHours / bioTime) * bio);
    if(bioCapacity < batchesNeeded) continue;

    for(let inc=1; inc<=maxSearch; inc++){
      const incCapacity = Math.floor((workHours / incTime) * inc);
      if(incCapacity < batchesNeeded) continue;

      for(let cab=1; cab<=maxSearch; cab++){
        const cabCapacity = Math.floor((workHours / cabTime) * cab);
        if(cabCapacity < batchesNeeded) continue;

        for(let lab=1; lab<=maxSearch; lab++){
          const laborCapacity = Math.floor((workHours / laborTime) * lab);
          if(laborCapacity < batchesNeeded) continue;

          const flasksNeeded = batchesNeeded * flasksPerBatch;

          const bioCost = (bio * bioPrice) / deprMonths;
          const incCost = (inc * incPrice) / deprMonths;
          const cabCost = (cab * cabPrice) / deprMonths;
          const flaskCost = flasksNeeded * flaskPrice;
          const laborCost = lab * salary;
          const doses = cellTarget / cellsPerDose;
          const patientTotal = doses * patientCost;

          const totalCost = bioCost + incCost + cabCost + flaskCost + laborCost + overhead + patientTotal;

          // full upfront equipment cost, not depreciated - for BEP
          const capex = (bio * bioPrice) + (inc * incPrice) + (cab * cabPrice);
          const monthlyOperating = flaskCost + laborCost + overhead + patientTotal;
          const monthlyRevenue = doses * revenuePerDose;
          const monthlyProfit = monthlyRevenue - monthlyOperating;

          if(best === null || totalCost < best.totalCost){
            best = { bio, inc, cab, lab, flasksNeeded, bioCost, incCost, cabCost, flaskCost, laborCost, overhead, patientTotal, totalCost, batchesNeeded, capex, monthlyOperating, monthlyRevenue, monthlyProfit };
          }
        }
      }
    }
  }

  const warningEl = document.getElementById('warning');
  const tbody = document.querySelector('#resultTable tbody');
  const stats = document.getElementById('stats');

  if(best === null){
    warningEl.textContent = 'No feasible config within search limit. Raise "max units to test" or check stage times.';
    stats.innerHTML = '';
    tbody.innerHTML = '';
    return;
  }
  warningEl.textContent = '';

  stats.innerHTML = `
    <div class="stat"><span>Batches needed / month</span><span>${best.batchesNeeded}</span></div>
    <div class="stat"><span>Total monthly cost</span><span>$${best.totalCost.toFixed(0)}</span></div>
    <div class="stat"><span>Cost per batch</span><span>$${(best.totalCost/best.batchesNeeded).toFixed(0)}</span></div>
  `;

  const bepEl = document.getElementById('bepStats');
  if(best.monthlyProfit <= 0){
    bepEl.innerHTML = `<div class="stat"><span>Break-even</span><span>Not reached — monthly cost exceeds revenue</span></div>`;
  } else {
    const bepMonths = best.capex / best.monthlyProfit;
    bepEl.innerHTML = `
      <div class="stat"><span>Upfront equipment cost (capex)</span><span>$${best.capex.toFixed(0)}</span></div>
      <div class="stat"><span>Monthly operating cost</span><span>$${best.monthlyOperating.toFixed(0)}</span></div>
      <div class="stat"><span>Monthly revenue</span><span>$${best.monthlyRevenue.toFixed(0)}</span></div>
      <div class="stat"><span>Monthly profit</span><span>$${best.monthlyProfit.toFixed(0)}</span></div>
      <div class="stat"><span>Break-even point</span><span>${bepMonths.toFixed(1)} months</span></div>
    `;
  }

  tbody.innerHTML = `
    <tr><td>Bioreactors</td><td>${best.bio}</td><td>$${best.bioCost.toFixed(0)}</td></tr>
    <tr><td>Incubators</td><td>${best.inc}</td><td>$${best.incCost.toFixed(0)}</td></tr>
    <tr><td>Biosafety cabinets</td><td>${best.cab}</td><td>$${best.cabCost.toFixed(0)}</td></tr>
    <tr><td>Laborants</td><td>${best.lab}</td><td>$${best.laborCost.toFixed(0)}</td></tr>
    <tr><td>Flasks (units/month)</td><td>${best.flasksNeeded}</td><td>$${best.flaskCost.toFixed(0)}</td></tr>
    <tr><td>Lab overhead</td><td>—</td><td>$${best.overhead.toFixed(0)}</td></tr>
    <tr><td>Patient treatment cost</td><td>—</td><td>$${best.patientTotal.toFixed(0)}</td></tr>
  `;
}

optimize();
</script>
</body>
</html>
